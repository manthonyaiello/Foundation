# Shared toolchain setup for the spark-* workflows, so the docs and proof jobs
# cannot drift apart. Adapted from memcp's .github/actions/setup-alire.
#
# The caller must run actions/checkout first: a local composite action is
# resolved from the workspace.
#
# Everything is pinned to the versions the campaign decided on
# (.claude/campaign/PLAN.md, "Decisions taken"): Alire 2.1.1, gnat_native
# 16.1.0 (sparklib ^16.1.0 needs GNAT 16), gprbuild 26.0.1, gnatprove 16.1.0,
# gnatdoc_bin 26.0.0 (the generation that pairs with gnat_native 16.1.0). The
# set of proved checks and of doc warnings IS the gate, so an index update
# must not be able to change what CI accepts without a commit saying so.
#
# All five have aarch64-linux builds in the Alire index, which is why the
# workflows run on ubuntu-24.04-arm: the same architecture, and so the same
# prover binaries, as the campaign's own machine.
name: Set up Alire for the SPARK crate
description: Install alr, the GNAT toolchain, and optionally gnatprove and gnatdoc.
inputs:
  gnatprove:
    description: Install gnatprove and put it on PATH.
    default: 'false'
  gnatdoc:
    description: Install gnatdoc and put it on PATH.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Install Alire and the toolchain
      uses: alire-project/setup-alire@v6.0.0
      with:
        version: 2.1.1
        toolchain: gnat_native=16.1.0 gprbuild=26.0.1

    # Tools, not crate dependencies: putting them in alire.toml would make
    # every build fetch them. `alr install` puts them in ~/.alire/bin.
    - name: Install gnatprove
      if: inputs.gnatprove == 'true'
      shell: bash
      run: |
        alr -n install gnatprove=16.1.0
        echo "$HOME/.alire/bin" >> "$GITHUB_PATH"

    - name: Install gnatdoc
      if: inputs.gnatdoc == 'true'
      shell: bash
      run: |
        alr -n install gnatdoc_bin=26.0.0
        echo "$HOME/.alire/bin" >> "$GITHUB_PATH"
