name: SPARK CI

# CI for the SPARK crate in spark/ (issue #3), on the memcp model. NSA's
# workflows are disabled on this fork (`gh workflow disable`, files untouched);
# only the spark-* workflows run.
#
#     trust --> docs --> prove
#                    \--> ffi
#
# trust  The trust-surface gate: every site gnatprove does not prove is listed,
#        with a justification, in spark/scripts/trust-surface.txt. git and awk
#        only, no toolchain, so it answers in seconds and gates the rest.
# docs   The GNATdoc gate: every entity in spark/src documented, and every doc
#        block on the declaration it describes. The HTML is uploaded.
# prove  The proof gate, through the reusable spark-prove.yml: every unit at
#        its committed level, nothing unproved outside the (empty)
#        spark/scripts/proof-xfail.txt, no warning. Warm from the proof cache;
#        PRs restore it and never save it, and only main saves.
# ffi    The FFI check (#4): spark/scripts/check-ffi.sh builds the crate as a
#        shared library with ghost code enabled and runs every property in
#        spark/cryptol/properties.txt against the NSA Cryptol.
#
# The SAW job is added by E4.
#
# Runners are ubuntu-24.04-arm: the same architecture as the campaign's own
# machine, so CI runs the same gnatprove and prover builds as local runs. The
# exception is ffi, on ubuntu-24.04 (x86_64): Cryptol has no arm64 Linux
# release, and the campaign machine's Cryptol is a source build.
on:
  push:
    branches: [main]
    paths:
      - 'spark/**'
      - '.github/**'
      - '.claude/**'
      - '!**.md'
  pull_request:
    paths:
      - 'spark/**'
      - '.github/**'
      - '.claude/**'
      - '!**.md'
  workflow_dispatch:

# A new commit on the same ref cancels the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, and what flows into the reusable prove call. Restoring and
# saving the cache needs no actions:write; only purging does, and only the
# daily refresh purges.
permissions:
  contents: read

jobs:
  trust:
    name: Trust surface (gate)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check trust surface
        run: spark/scripts/check-trust-surface.sh

  docs:
    name: GNATdoc (gate)
    needs: trust
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Placement first: it needs no toolchain, so a misplaced block is
      # answered before the install.
      - name: Check doc placement
        run: spark/scripts/check-doc-placement.sh

      - name: Set up Alire and gnatdoc
        uses: ./.github/actions/setup-alire-spark
        with:
          gnatdoc: 'true'

      # gnatdoc needs the Alire workspace (config GPRs, sparklib) and the
      # object directories; building the crate provides both, and checks that
      # it compiles.
      - name: Build
        working-directory: spark
        run: alr -n build

      - name: Check documentation
        run: spark/scripts/check-docs.sh

      # always(): the HTML is most worth reading when the gate just failed.
      - name: Upload API docs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spark-api-docs
          path: |
            spark/docs/api
            spark/docs/gnatdoc-run.txt
          if-no-files-found: ignore

  prove:
    name: Prove
    needs: docs
    uses: ./.github/workflows/spark-prove.yml
    with:
      restore: true
      save: ${{ github.ref == 'refs/heads/main' }}

  ffi:
    name: FFI (Cryptol, linux x86_64)
    needs: docs
    runs-on: ubuntu-24.04
    env:
      CRYPTOL_VERSION: 3.6.0
      CRYPTOL_TARBALL: cryptol-3.6.0-ubuntu-24.04-X64-with-solvers.tar.gz
      # sha256 of the release asset, checked before it is unpacked.
      CRYPTOL_SHA256: 621860aa1dedc037e8fc8355bef3edf023e41e78efb7177146126f5a87309962
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Alire
        uses: ./.github/actions/setup-alire-spark

      # The release build with solvers: Cryptol's type checker needs z3 to
      # start at all ("z3 is required to run Cryptol"), though :exhaust and
      # :check prove nothing. check-ffi.sh refuses a cryptol whose --version
      # lacks "FFI enabled".
      - name: Install Cryptol
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$CRYPTOL_TARBALL" \
            "https://github.com/GaloisInc/cryptol/releases/download/$CRYPTOL_VERSION/$CRYPTOL_TARBALL"
          echo "$CRYPTOL_SHA256  $RUNNER_TEMP/$CRYPTOL_TARBALL" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/cryptol"
          tar -xzf "$RUNNER_TEMP/$CRYPTOL_TARBALL" -C "$RUNNER_TEMP/cryptol" --strip-components=1
          echo "$RUNNER_TEMP/cryptol/bin" >> "$GITHUB_PATH"

      - name: Cryptol version
        run: cryptol --version

      # check-ffi.sh needs the Alire workspace (config GPRs, sparklib).
      - name: Build
        working-directory: spark
        run: alr -n build

      - name: Check FFI properties
        run: spark/scripts/check-ffi.sh

      - name: Upload FFI log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spark-ffi
          path: |
            spark/obj/ffi/ffi-results.txt
            spark/obj/ffi/run
          if-no-files-found: ignore
