name: SPARK bootstrap x86_64

# Tests spark/scripts/bootstrap-x86_64.sh, the one command
# that takes the ephemeral x86_64 instance from a bare Ubuntu 24.04 to a green
# check-ffi.sh. The instance dies 24 hours after it starts, so the script has
# to work the first time there; this is where it is shown to.
#
# bare       a GitHub ubuntu-24.04 (x86_64) runner with NO setup action and
#            no checkout: the script is fetched as the README's one command
#            fetches it, and installs and clones everything itself; the job
#            checks that it reported every tool fetched. Then it runs again
#            (--no-checks), with every tool now present, and the job checks
#            that it reported every tool "present and matching the pin" and
#            downloaded and apt-installed nothing. Then a SAW smoke
#            test runs two of NSA's small AES SAW scripts.
# container  the same script in a plain ubuntu:24.04 container (root, nothing
#            installed): the strictest bare image, and the one that measures
#            what the script must apt-install, i.e. what needs sudo on the
#            instance. It too runs again, and is checked the same way.
# lint       shellcheck, and scripts/test-bootstrap-detect.sh (the script's
#            present-or-fetch detection, against stub tools).
#
# llvm-link is not exercised here: the gnat-llvm phase needs GNAT_LLVM_DIR,
# GNAT Pro's LLVM, which is not public. test-bootstrap-detect.sh covers its
# detection.
#
# Neither bootstrap job proves: both run the script with --no-proof, so its
# build and ffi phases run and its proof phase is reported as skipped. The
# gnatprove gate is arm64 only (spark-prove.yml): x86_64's provers are slower
# on some goals, and six checks of Foundation_Spark.AES.Lemmas and
# Foundation_Spark.AES.Impl run out of time here (README "Bootstrapping the
# x86_64 instance").
on:
  pull_request:
    paths:
      - 'spark/scripts/bootstrap-x86_64.sh'
      - 'spark/scripts/test-bootstrap-detect.sh'
      - 'spark/scripts/toolchain-pins.env'
      - '.github/workflows/spark-bootstrap-x86_64.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The commit under test: the PR's head, or the dispatched ref's.
  FOUNDATION_REF: ${{ github.event.pull_request.head.sha || github.sha }}
  FOUNDATION_REMOTE: https://github.com/${{ github.repository }}.git
  FOUNDATION_SPARK_PROOF_ALLOWANCE: ci

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -x spark/scripts/bootstrap-x86_64.sh spark/scripts/test-bootstrap-detect.sh
      - name: Detection against stub tools
        run: spark/scripts/test-bootstrap-detect.sh

  bare:
    name: Bootstrap (bare ubuntu-24.04 runner)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      # As the README's one command does, from the commit under test.
      - name: Fetch the script
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bootstrap-x86_64.sh" \
            "https://raw.githubusercontent.com/${{ github.repository }}/$FOUNDATION_REF/spark/scripts/bootstrap-x86_64.sh"

      - name: Bootstrap
        shell: bash
        run: bash "$RUNNER_TEMP/bootstrap-x86_64.sh" --no-proof 2>&1 | tee "$HOME/bootstrap-run-1.log"

      # The steps below run even when a check of the bootstrap failed: they
      # need only the tools, and they answer questions of their own.
      - name: First run fetched every tool
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          status=0
          for t in alr gnat_native gprbuild gnatprove gnatdoc cryptol saw; do
            if grep -q "^>> $t [^ :]*: fetched (" "$HOME/bootstrap-run-1.log"; then
              echo "$t: fetched"
            else
              echo "::error::first run: $t not reported fetched"; status=1
            fi
          done
          exit "$status"

      - name: Bootstrap again (every tool present, no checks)
        if: ${{ !cancelled() }}
        shell: bash
        run: bash "$RUNNER_TEMP/bootstrap-x86_64.sh" --no-checks 2>&1 | tee "$HOME/bootstrap-run-2.log"

      - name: Second run fetched nothing
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          status=0
          for t in alr gnat_native gprbuild gnatprove gnatdoc cryptol saw; do
            if grep -q "^>> $t [^ :]*: present and matching the pin (" "$HOME/bootstrap-run-2.log"; then
              echo "$t: present and matching the pin"
            else
              echo "::error::second run: $t not reported present and matching the pin"; status=1
            fi
          done
          if grep -E '^>> (downloading |apt-get install)|: fetched \(' "$HOME/bootstrap-run-2.log"; then
            echo "::error::second run downloaded or installed something (above)"; status=1
          fi
          exit "$status"

      # Two of NSA's small AES SAW scripts, both `rme` proofs: SAW 1.6 runs,
      # and the repository's SAW scripts load and prove under it. Not the
      # big ones (all.saw, Cipher.saw).
      - name: SAW smoke test
        if: ${{ !cancelled() }}
        run: |
          . "$HOME/spark-tools/env.sh"
          saw --version
          export CRYPTOLPATH="$HOME/Foundation"
          cd "$HOME/Foundation/algorithms/AES/theorems"
          for f in GF28.saw SBox.saw; do
            echo "== saw $f"
            t0=$(date +%s)
            status=0
            saw "$f" > "$RUNNER_TEMP/saw-$f.log" 2>&1 || status=$?
            cat "$RUNNER_TEMP/saw-$f.log"
            secs=$(( $(date +%s) - t0 ))
            echo "== saw $f: exit $status, ${secs}s"
            echo "| \`saw $f\` | exit $status | ${secs}s |" >> "$RUNNER_TEMP/saw-summary.md"
            [ "$status" -eq 0 ] || exit "$status"
          done
          {
            echo "### SAW smoke test ($(saw --version | sed -n 1p))"
            echo
            echo "| script | result | wall-clock |"
            echo "|---|---|---|"
            cat "$RUNNER_TEMP/saw-summary.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-bare
          path: |
            ~/spark-tools/bootstrap-times.txt
            ~/bootstrap-run-*.log
            ~/Foundation/spark/obj/prove.log
            ~/Foundation/spark/obj/ffi/ffi-results.txt
            ${{ runner.temp }}/saw-*.log
          if-no-files-found: ignore

  container:
    name: Bootstrap (ubuntu:24.04 container, root)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container: ubuntu:24.04
    steps:
      # The image has no curl and no git, so the script comes from a checkout
      # (actions/checkout falls back to the REST API without git). It is not
      # a git checkout, so the script clones the fork into ~/Foundation.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.FOUNDATION_REF }}

      - name: Bootstrap
        shell: bash
        run: bash spark/scripts/bootstrap-x86_64.sh --no-proof 2>&1 | tee "$HOME/bootstrap-run-1.log"

      - name: First run fetched every tool
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          status=0
          for t in alr gnat_native gprbuild gnatprove gnatdoc cryptol saw; do
            if grep -q "^>> $t [^ :]*: fetched (" "$HOME/bootstrap-run-1.log"; then
              echo "$t: fetched"
            else
              echo "::error::first run: $t not reported fetched"; status=1
            fi
          done
          exit "$status"

      - name: Bootstrap again (every tool present, no checks)
        if: ${{ !cancelled() }}
        shell: bash
        run: bash spark/scripts/bootstrap-x86_64.sh --no-checks 2>&1 | tee "$HOME/bootstrap-run-2.log"

      - name: Second run fetched nothing
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          status=0
          for t in alr gnat_native gprbuild gnatprove gnatdoc cryptol saw; do
            if grep -q "^>> $t [^ :]*: present and matching the pin (" "$HOME/bootstrap-run-2.log"; then
              echo "$t: present and matching the pin"
            else
              echo "::error::second run: $t not reported present and matching the pin"; status=1
            fi
          done
          if grep -E '^>> (downloading |apt-get install)|: fetched \(' "$HOME/bootstrap-run-2.log"; then
            echo "::error::second run downloaded or installed something (above)"; status=1
          fi
          exit "$status"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-container
          path: |
            ~/spark-tools/bootstrap-times.txt
            ~/bootstrap-run-*.log
            ~/Foundation/spark/obj/prove.log
            ~/Foundation/spark/obj/ffi/ffi-results.txt
          if-no-files-found: ignore
