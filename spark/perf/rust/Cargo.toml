# The Rust side of the AES size and performance comparison:
# NSA's Rust Cipher and KeyExpansion crates (algorithms/AES/rust/), used
# as they are, behind one non-inlined wrapper per operation (src/lib.rs),
# and timed by src/main.rs. scripts/perf-aes.sh builds and runs it with the
# profiles below; README "Performance" gives the numbers.
[package]
name = "aes_perf"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "aes_perf"
path = "src/lib.rs"

[[bin]]
name = "aes_perf"
path = "src/main.rs"

[dependencies]
Cipher = { path = "../../../algorithms/AES/rust/Cipher" }
KeyExpansion = { path = "../../../algorithms/AES/rust/KeyExpansion" }

# The comparison's profiles: release, with the opt-level of the SPARK build
# it is set against, fat LTO and one codegen unit (whole-program
# optimization, the counterpart of GNAT's -flto), no debug info. Everything
# else is the release default: overflow checks off, debug assertions off,
# panic = "unwind". Slice bounds checks stay: Rust has no switch to remove
# them.
[profile.perf-o2]
inherits = "release"
opt-level = 2
lto = "fat"
codegen-units = 1

[profile.perf-o3]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
